  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

(110% 90% at 100% 10%,rgb(255 77 166/.08),transparent 50%)}\n.hero .lock{display:flex;align-items:center;gap:32px}\n.hero h1{font-size:88px;font-weight:700;letter-spacing:-.03em;line-height:1}\n.hero p{max-width:600px;margin:40px 0 0;font-size:20px;color:hsl(270 20% 28%)}\n.pills{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}\n.pill{font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--fg)}\n\n.sw{border:1px solid var(--line);border-radius:var(--radius-xl);overflow:hidden;background:#fff}\n.sw .chip{height:96px}\n.sw .meta{padding:12px 14px}\n.sw .nm{font-size:14px;font-weight:600}\n.sw .hex{font-size:12px;color:var(--muted);margin-top:2px}\n\n.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm)}\n.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius-xl);padding:28px}\n\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:14px;font-weight:500;border-radius:var(--radius-md);border:1px solid transparent;min-height:36px;padding:8px 16px;cursor:pointer;transition:filter .15s}\n.btn:hover{filter:brightness(1.05)}\n.btn.def{background:var(--violet);color:#fff;border-color:hsl(252 72% 52%)}\n.btn.sec{background:var(--secondary);color:var(--secondary-fg);border-color:hsl(262 45% 82%)}\n.btn.out{border-color:var(--line);color:var(--fg);box-shadow:0 1px 2px rgb(26 0 41/.06)}\n.btn.ghost{color:var(--fg)}.btn.ghost:hover{background:var(--canvas);filter:none}\n.btn.dgr{background:var(--danger);color:#fff}\n.btn.grad{background-image:var(--grad);color:#fff;box-shadow:var(--shadow-sm)}\n.btn svg{width:16px;height:16px}\n.input{height:36px;width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:var(--radius-md);padding:8px 12px;background:#fff;color:var(--fg)}\n.badge{display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-md);padding:2px 10px;font-size:12px;font-weight:600;border:1px solid transparent}\n.badge.def{background:var(--violet);color:#fff}.badge.sec{background:var(--secondary);color:var(--secondary-fg)}\n.badge.suc{background:var(--success);color:#fff}.badge.wrn{background:var(--warning);color:hsl(28 60% 14%)}.badge.dgr{background:var(--danger);color:#fff}\n.badge.out{border-color:var(--line);color:var(--fg)}\n.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}\n.tabs{display:inline-flex;gap:2px;padding:3px;background:var(--canvas);border-radius:10px}\n.tab{border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:500;color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer}\n.tab.on{background:#fff;color:var(--fg);box-shadow:var(--shadow-sm)}\n\n.dont-ok{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:hsl(270 20% 28%)}\n.dont-ok .m{font-weight:800;line-height:1.3}\n.ok .m{color:var(--success)} .no .m{color:var(--magenta)}\n\n.tint{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line)}\n.tint span{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9px;font-weight:600;font-family:'JetBrains Mono',monospace}\n\n.icogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}\n.ico{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:1px solid var(--line);border-radius:10px;background:#fff}\n.ico svg{width:22px;height:22px;color:var(--fg)}\n.ico span{font-size:10px;color:var(--muted)}\n\n.foot{padding:56px 40px;text-align:center;color:var(--muted);font-size:13px}\n@media(max-width:720px){.hero h1{font-size:56px}.wrap{padding:0 22px}.nav{padding:12px 22px}}\n\n@keyframes bd1{0%{transform:translate(28px,-40px);opacity:0}18%{opacity:1}32%,78%{transform:translate(0,0);opacity:1}96%,100%{transform:translate(28px,-40px);opacity:0}}\n@keyframes bd2{0%,6%{transform:tran {position:absolute;bottom:10px;left:12px;font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace}\n\n/* premium gradients */\n.mesh{position:relative;height:248px;border-radius:16px;overflow:hidden;background:#12001d;border:1px solid var(--line)}\n.mesh .blob{position:absolute;width:360px;height:360px;border-radius:50%;filter:blur(64px);mix-blend-mode:screen;will-change:transform}\n.mesh .cap{position:absolute;left:24px;bottom:20px;z-index:2}\n.grad-txt{background-image:linear-gradient(90deg,var(--violet),var(--orchid),var(--magenta),var(--amber),var(--violet));background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent}\n.gcard{position:relative;border-radius:14px;overflow:hidden;height:120px;border:1px solid var(--line);cursor:pointer;will-change:transform}\n.gcard .gmeta{position:absolute;left:14px;bottom:12px;color:#fff;text-shadow:0 1px 6px rgb(0 0 0/.35);z-index:2}\n.gcard .gname{font-size:14px;font-weight:600}.gcard .gsub{font-size:11px;opacity:.85}\n.conic-ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(from 0deg,var(--violet),var(--orchid),var(--magenta),var(--amber),var(--coral),var(--violet));-webkit-mask:radial-gradient(closest-side,transparent 60%,#000 61%);mask:radial-gradient(closest-side,transparent 60%,#000 61%);will-change:transform}\n\n/* ramp — static */\n.tint span{cursor:default}\n\n/* premium catalog */\n.acat{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}\n.atile{position:relative;height:174px;border:1px solid var(--line);border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;perspective:800px}\n.atile .anim-label{position:absolute;bottom:10px;left:12px;font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace}\n.magnetic{padding:12px 22px;border-radius:999px;background:var(--violet);color:#fff;font-weight:600;font-size:14px;cursor:pointer;will-change:transform;border:none;display:flex;gap:7px;align-items:center}\n.magnetic svg{width:15px;height:15px}\n.springcard{width:118px;height:66px;border-radius:12px;background:#fff;box-shadow:var(--shadow-sm);border:1px solid var(--line);will-change:transform;transform-style:preserve-3d;display:flex;align-items:center;padding:0 12px;gap:8px}\n.morph{width:76px;height:76px;background:var(--grad);will-change:border-radius,transform}\n.eltoggle{width:58px;height:32px;border-radius:999px;background:var(--canvas);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .3s}\n.eltoggle i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);will-change:transform}\n.count{font-size:48px;font-weight:700;letter-spacing:-.03em;color:var(--violet);line-height:1}\n.revword{overflow:hidden;line-height:1.15;font-size:22px;font-weight:700;letter-spacing:-.02em}\n.revword span{display:inline-block;will-change:transform,opacity}\n@media(max-width:720px){.acat{grid-template-columns:repeat(2,1fr)}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\"><defs>\n  <g id=\"bloom\">\n    <circle cx=\"72\" cy=\"30\" r=\"22\" fill=\"#6A48F4\" style=\"mix-blend-mode:multiply\"><\u002Fcircle>\n    <circle cx=\"48\" cy=\"48\" r=\"22\" fill=\"#C05CFF\" style=\"mix-blend-mode:multiply\"><\u002Fcircle>\n    <circle cx=\"72\" cy=\"70\" r=\"22\" fill=\"#FF4DA6\" style=\"mix-blend-mode:multiply\"><\u002Fcircle>\n    <circle cx=\"48\" cy=\"90\" r=\"22\" fill=\"#FF8C0A\" style=\"mix-blend-mode:multiply\"><\u002Fcircle>\n  <\u002Fg>\n  <g id=\"bloomR\">\n    <circle cx=\"72\" cy=\"30\" r=\"22\" fill=\"#6A48F4\" style=\"mix-blend-mode:screen\"><\u002Fcircle>\n    <circle cx=\"48\" cy=\"48\" r=\"22\" fill=\"#C05CFF\" style=\"mix-blend-mode:screen\"><\u002Fcircle>\n    <circle cx=\"72\" cy=\"70\" r=\"22\" fill=\"#FF4DA6\" style=\"mix-blend-mode:screen\"><\u002Fcircle>\n    <circle cx=\"48\" cy=\"90\" r=\"22\" fill=\"#FF8C0A\" style=\"mix-blend-mode:screen\"><\u002Fcircle>\n  <\u002Fg>\n  <g id=\"bloomMono\">\n    <circle cx=\"72\" cy=\"30\" r=\"22\" fill=\"currentColor\" fill-opacity=\".55\"><\u002Fcircle>\n    <circle cx=\"48\" cy=\"48\" r=\"22\" fill=\"currentColor\" fill-opacity=\".55\"><\u002Fcircle>\n    <circle cx=\"72\" cy=\"70\" r=\"22\" fill=\"currentColor\" fill-opacity=\".55\"><\u002Fcircle>\n    <circle cx=\"48\" cy=\"90\" r=\"22\" fill=\"currentColor\" fill-opacity=\".55\"><\u002Fcircle>\n  <\u002Fg>\n<\u002Fdefs><\u002Fsvg>\n\n<nav class=\"nav\">\n  <span class=\"brand\"><svg viewBox=\"0 0 120 120\" width=\"26\" height=\"26\"><use href=\"#bloom\"><\u002Fuse><\u002Fsvg>Serchi<\u002Fspan>\n  <a href=\"#logo\">Logo<\u002Fa><a href=\"#variaciones\">Variaciones<\u002Fa><a href=\"#proteccion\">Protección<\u002Fa><a href=\"#aplicaciones\">Aplicaciones<\u002Fa>\n  <a href=\"#color\">Color<\u002Fa><a href=\"#rampas\">Rampas<\u002Fa><a href=\"#type\">Tipografía<\u002Fa>\n  <a href=\"#motion\">Motion<\u002Fa><a href=\"#foundations\">Foundations<\u002Fa><a href=\"#icons\">Iconografía<\u002Fa><a href=\"#components\">Componentes<\u002Fa><a href=\"#voz\">Voz<\u002Fa>\n<\u002Fnav>\n\n<header class=\"hero\">\n  <div class=\"wrap\">\n    <div class=\"eyebrow\">Design System · v1<\u002Fdiv>\n    <div class=\"lock\" style=\"margin-top:48px\">\n      <svg viewBox=\"0 0 120 120\" width=\"112\" height=\"112\"><use href=\"#bloom\"><\u002Fuse><\u002Fsvg>\n      <h1>Serchi<\u002Fh1>\n    <\u002Fdiv>\n    <p>El sistema de diseño de la plataforma de reclutamiento con inteligencia embebida. Un instrumento, no un espectáculo: <b style=\"color:var(--violet)\">preciso, calmo y experto.<\u002Fb><\u002Fp>\n    <div class=\"pills\"><span class=\"pill\">Outfit<\u002Fspan><span class=\"pill\">Violeta de decisión<\u002Fspan><span class=\"pill\">El Bloom<\u002Fspan><span class=\"pill\">Light + Dark<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- 01 LOGO -->\n<section id=\"logo\"><div class=\"wrap\">\n  <div class=\"eyebrow\">01 — Logo<\u002Fdiv>\n  <h2 class=\"sec-h\">El Bloom<\u002Fh2>\n  <p class=\"sec-sub\">Cuatro talentos —violeta, orquídea, magenta, ámbar— convergen con blend multiply trazando la S de Serchi. Donde se superponen, nace el match: la inteligencia que conecta a la persona correcta con el rol correcto.<\u002Fp>\n\n  <h3 class=\"sub-h\">Construcción<\u002Fh3>\n  <div class=\"grid\" style=\"grid-template-columns:1fr 1fr;align-items:center\">\n    <div class=\"panel\" style=\"display:flex;align-items:center;justify-content:center;background:var(--cream)\">\n      <svg viewBox=\"-4 -4 128 128\" width=\"220\" height=\"220\" style=\"overflow:visible\">\n        <defs><pattern id=\"g\" width=\"20\" height=\"20\" patternUnits=\"userSpaceOnUse\"><path d=\"M20 0H0V20\" fill=\"none\" stroke=\"rgb(26 0 41/.08)\" stroke-width=\"1\"><\u002Fpath><\u002Fpattern><\u002Fdefs>\n        <rect x=\"-4\" y=\"-4\" width=\"128\" height=\"128\" fill=\"url(#g)\"><\u002Frect>\n        <circle cx=\"72\" cy=\"30\" r=\"22\" fill=\"none\" stroke=\"#6A48F4\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"><\u002Fcircle>\n        <circle cx=\"48\" cy=\"48\" r=\"22\" fill=\"none\" stroke=\"#C05CFF\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"><\u002Fcircle>\n        <circle cx=\"72\" cy=\"70\" r=\"22\" fill=\"none\" stroke=\"#FF4DA6\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"><\u002Fcircle>\n        <circle cx=\"48\" cy=\"90\" r=\"22\" fill=\"none\" stroke=\"#FF8C0A\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"><\u002Fcircle>\n        <g opacity=\".92\"><use href=\"#bloom\"><\u002Fuse><\u002Fg>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div class=\"panel\" style=\"padding:18px 22px\"><div style=\"font-size:13px;font-weight:600\">Cuatro círculos iguales<\u002Fdiv><div style=\"font-size:13px;color:var(--muted)\">Radio 22 sobre grilla de 120. Mismo tamaño = mismo peso: ningún talento vale más que otro.<\u002Fdiv><\u002Fdiv>\n      <div class=\"panel\" style=\"padding:18px 22px\"><div style=\"font-size:13px;font-weight:600\">Solapamiento en zig-zag<\u002Fdiv><div style=\"font-size:13px;color:var(--muted)\">Los centros dibujan la diagonal de la S. El desfase de 24px garantiza intersección constante.<\u002Fdiv><\u002Fdiv>\n      <div class=\"panel\" style=\"padding:18px 22px\"><div style=\"font-size:13px;font-weight:600\">Blend multiply<\u002Fdiv><div style=\"font-size:13px;color:var(--muted)\">Las intersecciones oscurecen y mezclan color — el \"match\" es visible, no decorativo.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 class=\"sub-h\">Anatomía del wordmark<\u002Fh3>\n  <div class=\"panel\" style=\"display:flex;align-items:center;justify-content:center;gap:26px;background:var(--cream);flex-wrap:wrap\">\n    <svg viewBox=\"0 0 120 120\" width=\"72\" height=\"72\"><use href=\"#bloom\"><\u002Fuse><\u002Fsvg>\n    <span style=\"font-size:64px;font-weight:700;letter-spacing:-.03em\">Serchi<\u002Fspan>\n    <div class=\"mono\" style=\"font-size:12px;color:var(--muted);line-height:1.9;border-left:1px solid var(--line);padding-left:20px\">Outfit 700<br>tracking −0.03em<br>símbolo = altura de mayúscula ×1.1<br>gap = ½ altura del símbolo<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- 02 VARIACIONES -->\n<section id=\"variaciones\"><div class=\"wrap\">\n  <div class=\"eyebrow\">02 — Variaciones y lockups<\u002Fdiv>\n  <h2 class=\"sec-h\">Un logo, cada contexto<\u002Fh2>\n  <p class=\"sec-sub\">Elige la versión por espacio y fondo, nunca por gusto. El símbolo solo se usa cuando \"Serchi\" ya está presente o el espacio es mínimo.<\u002Fp>\n\n  <div class=\"grid\" style=\"grid-template-columns:1fr 1fr 1fr;margin-top:32px\">\n    <div class=\"card\" style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:44px 20px;background:var(--cream)\">\n      <div style=\"display:flex;align-items:center;gap:16px\"><svg viewBox=\"0 0 120 120\" width=\"44\" height=\"44\"><use href=\"#bloom\"><\u002Fuse><\u002Fsvg><span style=\"font-size:34px;font-weight:700;letter-spacing:-.03em\">Serchi<\u002Fspan><\u002Fdiv>\n      <span class=\"mono\" style=\"font-size:11px;color:var(--muted)\">Horizontal · principal<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:44px 20px;background:var(--cream)\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><svg viewBox=\"0 0 120 120\" width=\"52\" height=\"52\"><use href=\"#bloom\"><\u002Fuse><\u002Fsvg><span style=\"font-size:26px;font-weight:700;letter-spacing:-.03em\">Serchi<\u002Fspan><\u002Fdiv>\n      <span class=\"mono\" style=\"font-size:11px;color:var(--muted)\">Vertical · apilado<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:44px 20px;background:var(--cream)\">\n      <svg viewBox=\"0 0 120 120\" width=\"64\" height=\"64\"><use href=\"#bloom\"><\u002Fuse><\u002Fsvg>\n      <span class=\"mono\" style=\"font-size:11px;color:var(--muted)\">Símbolo solo<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 class=\"sub-h\">App icon &amp; favicon<\u002Fh3>\n  <div class=\"grid\" style=\"grid-template-columns:repeat(5,1fr);align-items:end\">\n    <div style=\"text-align:center\"><div style=\"width:100%;aspect-ratio:1;border-radius:24%;display:flex;align-items:center;justify-content:center;background:var(--grad)\"><svg viewBox=\"0 0 120 120\" width=\"60%\"><use href=\"#bloomR\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div class=\"mono\" style=\"font-size:10px;color:var(--muted);margin-top:8px\">iOS · gradient<\u002Fdiv><\u002Fdiv>\n    <div style=\"text-align:center\"><div style=\"width:100%;aspect-ratio:1;border-radius:24%;display:flex;align-items:center;justify-content:center;background:var(--deep)\"><svg viewBox=\"0 0 120 120\" width=\"60%\"><use href=\"#bloomR\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div class=\"mono\" style=\"font-size:10px;color:var(--muted);margin-top:8px\">Deep<\u002Fdiv><\u002Fdiv>\n    <div style=\"text-align:center\"><div style=\"width:100%;aspect-ratio:1;border-radius:24%;display:flex;align-items:center;justify-content:center;background:var(--cream);border:1px solid var(--line)\"><svg viewBox=\"0 0 120 120\" width=\"60%\"><use href=\"#bloom\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div class=\"mono\" style=\"font-size:10px;color:var(--muted);margin-top:8px\">Cream<\u002Fdiv><\u002Fdiv>\n    <div style=\"text-align:center\"><div style=\"width:72px;height:72px;margin:0 auto;border-radius:16px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line)\"><svg viewBox=\"0 0 120 120\" width=\"60%\"><use href=\"#bloom\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div class=\"mono\" style=\"font-size:10px;color:var(--muted);margin-top:8px\">Favicon 32<\u002Fdiv><\u002Fdiv>\n    <div style=\"text-align:center\"><div style=\"width:44px;height:44px;margin:0 auto;border-radius:11px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line)\"><svg viewBox=\"0 0 120 120\" width=\"62%\"><use href=\"#bloom\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div class=\"mono\" style=\"font-size:10px;color:var(--muted);margin-top:8px\">16<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- 03 PROTECCION -->\n<section id=\"proteccion\"><div class=\"wrap\">\n  <div class=\"eyebrow\">03 — Zona de protección<\u002Fdiv>\n  <h2 class=\"sec-h\">Zona de protección y usos<\u002Fh2>\n  <p class=\"sec-sub\">Deja respirar al Bloom. El espacio libre mínimo alrededor del logo equivale al radio de un círculo (½ del símbolo) por cada lado.<\u002Fp>\n\n  <div class=\"grid\" style=\"grid-template-columns:1fr 1fr;margin-top:32px;align-items:stretch\">\n    <div class=\"panel\" style=\"display:flex;align-items:center;justify-content:center;background:var(--canvas)\">\n      <div style=\"position:relative;padding:44px\">\n        <div style=\"position:absolute;inset:0;border:1.5px dashed var(--orchid);border-radius:12px;opacity:.6\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:14px\"><svg viewBox=\"0 0 120 120\" width=\"46\" height=\"46\"><use href=\"#bloom\"><\u002Fuse><\u002Fsvg><span style=\"font-size:32px;font-weight:700;letter-spacing:-.03em\">Serchi<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel\">\n      <div style=\"font-size:14px;font-weight:600;margin-bottom:6px\">Tamaños mínimos<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:24px;padding:14px 0 20px;border-bottom:1px solid var(--line)\">\n        <div style=\"text-align:center\"><div style=\"display:flex;align-items:center;gap:8px\"><svg viewBox=\"0 0 120 120\" width=\"28\" height=\"28\"><use href=\"#bloom\"><\u002Fuse><\u002Fsvg><span style=\"font-size:20px;font-weight:700;letter-spacing:-.03em\">Serchi<\u002Fspan><\u002Fdiv><div class=\"mono\" style=\"font-size:10px;color:var(--muted);margin-top:8px\">digital · 20px alto<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:center\"><svg viewBox=\"0 0 120 120\" width=\"24\" height=\"24\"><use href=\"#bloom\"><\u002Fuse><\u002Fsvg><div class=\"mono\" style=\"font-size:10px;color:var(--muted);margin-top:8px\">símbolo · 16px<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:14px;font-weight:600;margin:16px 0 8px\">Fondos permitidos<\u002Fdiv>\n      <div style=\"display:flex;gap:10px\">\n        <div style=\"width:44px;height:44px;border-radius:10px;background:var(--cream);border:1px solid var(--line);display:grid;place-items:center\"><svg viewBox=\"0 0 120 120\" width=\"26\"><use href=\"#bloom\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <div style=\"width:44px;height:44px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center\"><svg viewBox=\"0 0 120 120\" width=\"26\"><use href=\"#bloom\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <div style=\"width:44px;height:44px;border-radius:10px;background:var(--deep);display:grid;place-items:center\"><svg viewBox=\"0 0 120 120\" width=\"26\"><use href=\"#bloomR\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 class=\"sub-h\">Correcto vs incorrecto<\u002Fh3>\n  <div class=\"grid\" style=\"grid-template-columns:1fr 1fr\">\n    <div class=\"panel\" style=\"display:flex;flex-direction:column;gap:12px\">\n      <div class=\"dont-ok ok\"><span class=\"m\">✓<\u002Fspan>Sobre crema, blanco o Profundo sólido<\u002Fdiv>\n      <div class=\"dont-ok ok\"><span class=\"m\">✓<\u002Fspan>Reverse (screen) sobre fondos oscuros<\u002Fdiv>\n      <div class=\"dont-ok ok\"><span class=\"m\">✓<\u002Fspan>Símbolo en gradiente solo dentro del app icon<\u002Fdiv>\n      <div class=\"dont-ok ok\"><span class=\"m\">✓<\u002Fspan>Respetando la zona de protección<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel\" style=\"display:flex;flex-direction:column;gap:12px\">\n      <div class=\"dont-ok no\"><span class=\"m\">✕<\u002Fspan>No rotar, inclinar ni reordenar los círculos<\u002Fdiv>\n      <div class=\"dont-ok no\"><span class=\"m\">✕<\u002Fspan>No recolorear ni cambiar el blend<\u002Fdiv>\n      <div class=\"dont-ok no\"><span class=\"m\">✕<\u002Fspan>No estirar el wordmark ni cambiar la tipografía<\u002Fdiv>\n      <div class=\"dont-ok no\"><span class=\"m\">✕<\u002Fspan>No colocar sobre fondos saturados de la paleta<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- 04 APLICACIONES -->\n<section id=\"aplicaciones\"><div class=\"wrap\">\n  <div class=\"eyebrow\">04 — Aplicaciones<\u002Fdiv>\n  <h2 class=\"sec-h\">La marca en el mundo<\u002Fh2>\n  <p class=\"sec-sub\">El Bloom sobre superficies reales: producto, redes, papelería y correo. Crema y Profundo hac =\"#C05CFF\" style=\"mix-blend-mode:multiply;transform-origin:48px 48px;animation:bloomPop 2.4s ease-in-out .3s infinite\"><\u002Fcircle>\n          <circle cx=\"72\" cy=\"70\" r=\"22\" fill=\"#FF4DA6\" style=\"mix-blend-mode:multiply;transform-origin:72px 70px;animation:bloomPop 2.4s ease-in-out .6s infinite\"><\u002Fcircle>\n          <circle cx=\"48\" cy=\"90\" r=\"22\" fill=\"#FF8C0A\" style=\"mix-blend-mode:multiply;transform-origin:48px 90px;animation:bloomPop 2.4s ease-in-out .9s infinite\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"padding:13px 16px;border-top:1px solid var(--line)\"><div style=\"font-size:13.5px;font-weight:600\">Relevo<\u002Fdiv><div style=\"font-size:12px;color:var(--muted);margin-top:2px\">Progreso paso a paso — pipeline, etapas del proceso<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"overflow:hidden\">\n      <div style=\"height:180px;display:flex;align-items:center;justify-content:center;background:var(--cream)\">\n        <svg viewBox=\"0 0 120 120\" width=\"92\" height=\"92\" style=\"overflow:visible;animation:bloomFocus 3.4s ease infinite\">\n          <circle cx=\"72\" cy=\"30\" r=\"22\" fill=\"#6A48F4\" style=\"mix-blend-mode:multiply\"><\u002Fcircle>\n          <circle cx=\"48\" cy=\"48\" r=\"22\" fill=\"#C05CFF\" style=\"mix-blend-mode:multiply\"><\u002Fcircle>\n          <circle cx=\"72\" cy=\"70\" r=\"22\" fill=\"#FF4DA6\" style=\"mix-blend-mode:multiply\"><\u002Fcircle>\n          <circle cx=\"48\" cy=\"90\" r=\"22\" fill=\"#FF8C0A\" style=\"mix-blend-mode:multiply\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"padding:13px 16px;border-top:1px solid var(--line)\"><div style=\"font-size:13.5px;font-weight:600\">Enfoque<\u002Fdiv><div style=\"font-size:12px;color:var(--muted);margin-top:2px\">De difuso a nítido — resultados de búsqueda, revelado de match<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"overflow:hidden ><span style=\"font-size:13px;font-weight:600;display:flex;gap:7px;align-items:center\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--amber)\"><\u002Fspan>Oferta<\u002Fspan><span class=\"badge sec\" style=\"padding:1px 8px\">1<\u002Fspan><\u002Fdiv>\n        <div class=\"card\" style=\"box-shadow:none;padding:12px\"><div style=\"display:flex;justify-content:space-between\"><b style=\"font-size:14px\">Sara Kim<\u002Fb><span style=\"font-weight:700;color:var(--amber);font-size:12px\">92<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:var(--muted)\">Product Manager<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- 11 VOZ -->\n<section id=\"voz\"><div class=\"wrap\">\n  <div class=\"eyebrow\">12 — Tono y personalidad<\u002Fdiv>\n  <h2 class=\"sec-h\">Cómo suena Serchi<\u002Fh2>\n  <p class=\"sec-sub\">Preciso, calmo y experto. Hablamos de resultados, no de tecnología. Español claro y directo, sin hype ni relleno.<\u002Fp>\n\n  <div class=\"grid\" style=\"grid-template-columns:repeat(3,1fr);margin-top:32px\">\n    <div class=\"panel\"><div style=\"display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:8px\"><i data-lucide=\"target\" style=\"width:18px;height:18px;color:var(--violet)\"><\u002Fi>Preciso<\u002Fdiv><div style=\"font-size:13px;color:var(--muted)\">Cada palabra informa una decisión. Datos cuando ayudan; nada de números decorativos.<\u002Fdiv><\u002Fdiv>\n    <div class=\"panel\"><div style=\"display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:8px\"><i data-lucide=\"wind\" style=\"width:18px;height:18px;color:var(--magenta)\"><\u002Fi>Calmo<\u002Fdiv><div style=\"font-size:13px;color:var(--muted)\">Confianza silenciosa. Ni urgencia falsa ni signos de exclamación de más.<\u002Fdiv><\u002Fdiv>\n    <div class=\"panel\"><div style=\"display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:8px\"><i data-lucide=\"graduation-cap\" style=\"width:18px;height:18px;color:var(--amber)\"><\u002Fi>Experto<\u002Fdiv><div style=\"font-size:13px;color:var(--muted)\">Conocemos el oficio del reclutador. Hablamos su idioma, sin jerga técnica en superficie.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 class=\"sub-h\">Decimos / No decimos<\u002Fh3>\n  <div class=\"grid\" style=\"grid-template-columns:1fr 1fr\">\n    <div class=\"panel\" style=\"display:flex;flex-direction:column;gap:14px\">\n      <div class=\"dont-ok ok\"><span class=\"m\">✓<\u002Fspan><div><b style=\"font-weight:600\">\"Cierra roles más rápido.\"<\u002Fb><div style=\"font-size:12px;color:var(--muted)\">Resultado concreto, verbo de acción.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"dont-ok ok\"><span class=\"m\">✓<\u002Fspan><div><b style=\"font-weight:600\">\"3 candidatos listos para entrevista.\"<\u002Fb><div style=\"font-size:12px;color:var(--muted)\">Dato que mueve la siguiente acción.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"dont-ok ok\"><span class=\"m\">✓<\u002Fspan><div><b style=\"font-weight:600\">\"Revisamos 240 perfiles por ti.\"<\u002Fb><div style=\"font-size:12px;color:var(--muted)\">El trabajo hecho, en lenguaje humano.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel\" style=\"display:flex;flex-direction:column;gap:14px\">\n      <div class=\"dont-ok no\"><span class=\"m\">✕<\u002Fspan><div><b style=\"font-weight:600\">\"¡Revoluciona tu reclutamiento con IA! 🚀\"<\u002Fb><div style=\"font-size:12px;color:var(--muted)\">Hype, emoji, promesa vacía.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"dont-ok no\"><span class=\"m\">✕<\u002Fspan><div><b style=\"font-weight:600\">\"Nuestro motor de embeddings ML…\"<\u002Fb><div style=\"font-size:12px;color:var(--muted)\">Jerga técnica en superficie de usuario.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"dont-ok no\"><span class=\"m\">✕<\u002Fspan><div><b style=\"font-weight:600\">\"La plataforma #1 del mercado\"<\u002Fb><div style=\"font-size:12px;color:var(--muted)\">Superlativo sin sustento.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- 12 TOKENS -->\n<section id=\"tokens\" style=\"border-bottom:none\"><div class=\"wrap\">\n  <div class=\"eyebrow\">13 — Tokens<\u002Fdiv>\n  <h2 class=\"sec-h\">Referencia rápida<\u002Fh2>\n  <p class=\"sec-sub\">Los nombres reales viven en <span class=\"mono\" style=\"font-size:.85em\">styles.css → tokens/*.css<\u002Fspan>. Consumidores enlazan solo <span class=\"mono\" style=\"font-size:.85em\">styles.css<\u002Fspan>.<\u002Fp>\n  <div class=\"panel mono\" style=\"margin-top:32px;font-size:12.5px;line-height:2;color:hsl(270 20% 28%);overflow-x:auto\">\n    <div><span style=\"color:var(--violet)\">--primary<\u002Fspan>: 252 89% 62%; &nbsp; <span style=\"color:var(--violet)\">--background<\u002Fspan>: 28 50% 99%; &nbsp; <span style=\"color:var(--violet)\">--foreground<\u002Fspan>: 270 30% 12%;<\u002Fdiv>\n    <div><span style=\"color:var(--violet)\">--brand-violet<\u002Fspan>: #6A48F4; &nbsp; <span style=\"color:var(--violet)\">--brand-magenta<\u002Fspan>: #FF4DA6; &nbsp; <span style=\"color:var(--violet)\">--brand-amber<\u002Fspan>: #FF8C0A;<\u002Fdiv>\n    <div><span style=\"color:var(--violet)\">--radius-md<\u002Fspan>: 6px; &nbsp; <span style=\"color:var(--violet)\">--radius-xl<\u002Fspan>: 12px; &nbsp; <span style=\"color:var(--violet)\">--radius-2xl<\u002Fspan>: 16px;<\u002Fdiv>\n    <div><span style=\"color:var(--violet)\">--font-sans<\u002Fspan>: 'Outfit'; &nbsp; <span style=\"color:var(--violet)\">--brand-gradient<\u002Fspan>: linear-gradient(135deg, …);<\u002Fdiv>\n    <div><span style=\"color:var(--violet)\">--dur-base<\u002Fspan>: 150ms; &nbsp; <span style=\"color:var(--violet)\">--ease-spring<\u002Fspan>: (.34,1.26,.64,1); &nbsp; <span style=\"color:var(--violet)\">--shadow-sm/md/lg<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin-top:20px;font-size:13px;color:var(--muted)\">El sistema completo (tokens, componentes React, guidelines) vive en este proyecto y se instala vía Share → File type → Design System.<\u002Fp>\n<\u002Fdiv><\u002Fsection>\n\n<div class=\"foot\"><svg viewBox=\"0 0 120 120\" width=\"22\" height=\"22\" style=\"vertical-align:middle;margin-right:8px\"><use href=\"#bloom\"><\u002Fuse><\u002Fsvg>Serchi Design System · v1<\u002Fdiv>\n\n<script>\nif(window.lucide)lucide.createIcons();\n(function(){\n  var g=window.gsap; if(!g) return;\n  // Magnetic button\n  var mag=document.getElementById('magBtn');\n  if(mag){var mp=mag.parentElement;\n    mp.addEventListener('pointermove',function(e){var r=mp.getBoundingClientRect();g.to(mag,{x:(e.clientX-r.left-r.width/2)*.45,y:(e.clientY-r.top-r.height/2)*.45,duration:.4,ease:'power3.out'});});\n    mp.addEventListener('pointerleave',function(){g.to(mag,{x:0,y:0,duration:.7,ease:'elastic.out(1,.4)'});});\n  }\n  // Spring lift card\n  var sc=document.getElementById('springCard');\n  if(sc){var sp=sc.parentElement;\n    g.to(sc,{y:-6,duration:1.7,ease:'sine.inOut',repeat:-1,yoyo:true});\n    sp.addEventListener('pointerenter',function(){g.to(sc,{y:-14,rotationX:9,rotationY:-9,scale:1.06,duration:.6,ease:'elastic.out(1,.5)',overwrite:true});});\n    sp.addEventListener('pointerleave',function(){g.to(sc,{y:0,rotationX:0,rotationY:0,scale:1,duration:.5,ease:'power2.out',overwrite:true});});\n  }\n  // Morph orb\n  var morph=document.getElementById('morph');\n  if(morph)g.to(morph,{borderRadius:'52% 48% 42% 58% / 55% 45% 55% 45%',rotate:200,duration:3,ease:'sine.inOut',repeat:-1,yoyo:true});\n  // Elastic toggle\n  var tg=document.getElementById('elToggle');\n  if(tg){var on=false,knob=tg.querySelector('i');\n    function set(){g.to(knob,{x:on?26:0,duration:.65,ease:'elastic.out(1,.45)'});tg.style.background=on?'var(--violet)':'var(--canvas)';}\n    tg.addEventListener('click',function(){on=!on;set();});\n    setInterval(function(){on=!on;set();},1900);\n  }\n  // Count up\n  var cnt=document.getElementById('fitCount');\n  if(cnt){var o={v:0};function run(){o.v=0;g.to(o,{v:92,duration:1.8,ease:'power2.out',onUpdate:function(){cnt.textContent=Math.round(o.v);}});}run();setInterval(run,3800);}\n  // Word reveal\n  var rw=document.getElementById('revWord');\n  if(rw){var w=rw.querySelectorAll('span');var t2=g.timeline({repeat:-1,repeatDelay:1});\n    t2.from(w,{yPercent:130,opacity:0,duration:.7,ease:'power4.out',stagger:.13})\n      .to(w,{yPercent:-130,opacity:0,duration:.5,ease:'power2.in',stagger:.08},'+=1.3');}\n  // Mesh blobs drift\n  document.querySelectorAll('#mesh .blob').forEach(function(b,i){g.to(b,{x:'random(-80,80)',y:'random(-50,50)',scale:'random(.8,1.3)',duration:'random(5,8)',ease:'sine.inOut',repeat:-1,yoyo:true,delay:i*.4});});\n  var gt=document.getElementById('gradtxt'); if(gt)g.fromTo(gt,{backgroundPositionX:'0%'},{backgroundPositionX:'220%',duration:5,ease:'sine.inOut',repeat:-1,yoyo:true});\n  var cr=document.getElementById('conic'); if(cr)g.to(cr,{rotate:360,duration:6,ease:'none',repeat:-1});\n  // gcard hover\n  document.querySelectorAll('.gcard').forEach(function(c){\n    c.addEventListener('pointerenter',function(){g.to(c,{scale:1.035,duration:.4,ease:'power3.out'});});\n    c.addEventListener('pointerleave',function(){g.to(c,{scale:1,duration:.4,ease:'power2.out'});});\n  });\n})();\n<\u002Fscript>\n\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
